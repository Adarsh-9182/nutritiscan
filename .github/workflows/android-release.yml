name: Android APK
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPO_PUBLIC_WEB_ORIGIN: https://nutritiscan.com
      CI: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: npm ci
      - run: npm run lint && npm run typecheck && npm test
      - run: npx expo prebuild --platform android --no-install
      - run: node scripts/prepare-release.mjs
      - uses: gradle/actions/setup-gradle@v4
      - name: Build standalone release APK
        working-directory: android
        run: ./gradlew :app:assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,x86_64
      - name: Sign and verify APK
        env:
          RELEASE_KEYSTORE: ${{ secrets.ANDROID_RELEASE_KEYSTORE }}
          RELEASE_PASSWORD: ${{ secrets.ANDROID_RELEASE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$RELEASE_KEYSTORE" && test -n "$RELEASE_PASSWORD"
          printf '%s' "$RELEASE_KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          mkdir -p release
          "$BUILD_TOOLS/zipalign" -p -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias nutritiscan --ks-pass env:RELEASE_PASSWORD --key-pass env:RELEASE_PASSWORD --out release/NutritiScan.apk "$RUNNER_TEMP/aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose release/NutritiScan.apk
          "$BUILD_TOOLS/aapt" dump badging release/NutritiScan.apk | head -1
          cd release && sha256sum NutritiScan.apk > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: nutritiscan-signed-apk
          path: release/*
          retention-days: 30
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: nutritiscan-signed-apk
          path: release
      - name: Publish GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/NutritiScan.apk release/SHA256SUMS --title "NutritiScan $GITHUB_REF_NAME · Android beta" --notes-file docs/android-release-notes.md --prerelease --verify-tag
